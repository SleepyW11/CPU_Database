<section class="cpu-item">
    <button class="cpu-title" type="button" onclick="itemReplaceFull(xyzitem00)">{{name}}</button>
    <div class="cpu-meta">
        <span>{{socket}}</span>
        <span>{{year}}</span>
    </div>
    <div class="cpu-spec-grid">
        <div><span>Base clock</span><strong>{{base}} GHz</strong></div>
        <div><span>Max boost</span><strong>{{boost}}</strong></div>
        <div><span>Cores</span><strong>{{cores}}</strong></div>
        <div><span>Threads</span><strong>{{threads}}</strong></div>
        <div><span>TDP</span><strong>{{tdp}} W</strong></div>
        <div><span>Cache</span><strong>{{l3c}}</strong></div>
    </div>
</section>
